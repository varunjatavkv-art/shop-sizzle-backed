name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20          # 20 is more stable than 24 for now
          cache: 'npm'              # Speeds up installs

      - name: Install dependencies
        run: npm ci                 # Better than npm install in CI

      - name: Run tests
        run: npm test
